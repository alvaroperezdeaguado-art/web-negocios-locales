# Publica la web en GitHub Pages cada vez que se guarda un cambio en "main".
# Primero comprueba config.js: si tiene un error, NO publica y lo explica
# (la web que ya estaba publicada sigue funcionando).
name: Publicar la web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-web
  cancel-in-progress: true

jobs:
  publicar:
    name: Comprobar config.js y publicar
    runs-on: ubuntu-latest
    steps:
      - name: Descargar los archivos
        uses: actions/checkout@v5

      - name: Comprobar config.js y preparar la web
        run: node scripts/construir.js

      - name: Publicar en la rama gh-pages
        working-directory: _site
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publicar web (${GITHUB_SHA::7})"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "Publicado. La web se actualiza en 1-2 minutos." >> "$GITHUB_STEP_SUMMARY"
